<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="men-rosette.png">
<title>Mamounia | Moroccan clothing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Store choice: an ivory band with the name, then two doors. One light look on purpose. */
:root{--ivory:#FBF8F1;--ink:#1C2621;--muted:#5A645E;--line:#E6DCC4;--green:#0E4A36;--green-dk:#0A3527;--rose:#8C3B5A;--rose-dk:#5E2339;--gold:#C9A24A;--gold-ink:#7A5A1C;
  --f-display:"Cormorant Garamond",Georgia,serif;--f-body:"Jost",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;min-height:100%}
.band{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:var(--ivory);border-bottom:1px solid var(--line)}
.brand{grid-column:2;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand img{width:min(280px,64vw);height:auto;display:block}
.brand .tag{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-ink)}
h1{margin:4px 0 0;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(20px,2.2vw,26px);color:var(--ink)}
.lang{grid-column:3;justify-self:end;display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:14px}
.lang select{border:1px solid var(--line);background:#fff;font-family:var(--f-body);font-size:14px;color:var(--green);min-height:38px;padding:0 8px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.doors{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:560px;transition:grid-template-columns .9s cubic-bezier(.22,.8,.2,1)}
.doors.pick-men{grid-template-columns:1.22fr .78fr} .doors.pick-women{grid-template-columns:.78fr 1.22fr}
.side{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 20px 34px;text-decoration:none;color:#fff;isolation:isolate}
.side.men{background:var(--green)} .side.women{background:var(--rose)}
.side .pat{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);opacity:.55;z-index:-2;transition:opacity .8s ease,transform 8s linear;transform:translate3d(0,0,0)}
.side:hover .pat,.side:focus-visible .pat{opacity:.8;transform:translate3d(-28px,-20px,0) rotate(.6deg)}
.side .shade{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 0,rgba(0,0,0,.28) 100%);transition:background .6s}
.doors.pick-men .women .shade,.doors.pick-women .men .shade{background:rgba(10,14,12,.45)}
/* the door */
.door{position:relative;width:min(330px,74%);aspect-ratio:300/420;display:block;transition:transform .7s cubic-bezier(.22,.8,.2,1),filter .7s}
.door::before{content:"";position:absolute;inset:0;background:var(--ivory);border-radius:50% 50% 6px 6px/36% 36% 6px 6px;box-shadow:0 30px 60px rgba(0,0,0,.28),inset 0 0 0 1px rgba(201,162,74,.35)}
.side:hover .door,.side:focus-visible .door{transform:translateY(-8px) scale(1.025)}
.doors.pick-men .women .door,.doors.pick-women .men .door{filter:saturate(.7) brightness(.92);transform:scale(.96)}
.arch-line{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);overflow:visible;z-index:1}
.arch-line path{fill:none;stroke:var(--gold);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .25s cubic-bezier(.6,0,.2,1) forwards}
.side:hover .arch-line path{stroke-width:2.2}
@keyframes draw{to{stroke-dashoffset:0}}
.door-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22% 12% 12%;text-align:center;color:var(--ink)}
.door-logo{width:100%;height:auto;display:block;opacity:0;transform:translateY(8px);animation:rise .9s .9s ease forwards}
.door-what{font-size:13.5px;line-height:1.5;color:var(--muted);opacity:0;animation:rise .9s 1.1s ease forwards}
.door-go{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border:1px solid currentColor;opacity:0;animation:rise .9s 1.25s ease forwards;transition:background .35s,color .35s}
.men .door-go{color:var(--green)} .women .door-go{color:var(--rose);border-radius:999px}
.door-go i{font-style:normal;transition:transform .35s}
.side:hover .door-go{background:currentColor} .side.men:hover .door-go{background:var(--green);color:#fff} .side.women:hover .door-go{background:var(--rose);color:#fff}
.side:hover .door-go i{transform:translateX(5px)}
@keyframes rise{to{opacity:1;transform:none}}
.side-cats{font-family:var(--f-display);font-style:italic;font-size:20px;letter-spacing:.04em;color:rgba(255,255,255,.88)}
/* the gold seam between the stores, with the rosette */
.seam{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(transparent,rgba(231,201,122,.8) 18%,rgba(231,201,122,.8) 82%,transparent);z-index:3;pointer-events:none;transition:left .9s cubic-bezier(.22,.8,.2,1)}
.seam img{position:absolute;top:50%;left:50%;width:64px;height:auto;transform:translate(-50%,-50%);animation:spin 60s linear infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.doors.pick-men .seam{left:61%} .doors.pick-women .seam{left:39%}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
:focus-visible{outline:2px solid var(--gold);outline-offset:-6px}
/* leaving: the chosen color opens from the door and covers everything */
.switcher{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;pointer-events:none;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .75s cubic-bezier(.7,0,.2,1)}
.switcher.in{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
.switcher img{width:min(380px,72vw);height:auto;opacity:0;transform:scale(.94);transition:opacity .5s ease .3s,transform .6s ease .3s}
.switcher.in img{opacity:1;transform:none}
@media (max-width:760px){
  .band{grid-template-columns:1fr;justify-items:center}.brand{grid-column:1}.lang{grid-column:1;justify-self:center}
  .doors,.doors.pick-men,.doors.pick-women{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:0;flex:0 0 auto}
  .side{padding:30px 16px 26px;gap:14px}.door{width:min(230px,60vw)}.side-cats{font-size:16px}
  .door{aspect-ratio:auto;width:min(300px,82vw);padding:64px 16px 22px}
  .door::before{border-radius:150px 150px 6px 6px/110px 110px 6px 6px}
  .door-in{position:relative;inset:auto;gap:10px;padding:0 6%}.door-what{font-size:12.5px}.door-go{padding:10px 12px;font-size:10px}
  .brand .tag{letter-spacing:.16em;font-size:10.5px}.seam img{width:52px}
  .seam{left:0!important;right:0;top:50%;bottom:auto;width:auto;height:1px;background:linear-gradient(90deg,transparent,rgba(231,201,122,.8) 18%,rgba(231,201,122,.8) 82%,transparent)}
}
html[lang="ar"] body{font-family:"Noto Naskh Arabic",Tahoma,sans-serif} html[lang="ur"] body{font-family:"Noto Nastaliq Urdu",serif}
html[lang="ar"] h1,html[lang="ur"] h1{font-style:normal}
html[dir="rtl"] .brand .tag,html[dir="rtl"] .door-go{letter-spacing:0;text-transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.door-logo,.door-what,.door-go{opacity:1;transform:none}.arch-line path{stroke-dashoffset:0}}
</style>
</head>
